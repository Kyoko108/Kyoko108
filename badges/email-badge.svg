<svg width="220" height="45" viewBox="0 0 220 45" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="em1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E1306C">
        <animate attributeName="stop-color"
          values="#E1306C;#00C6FF;#E1306C"
          dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00C6FF">
        <animate attributeName="stop-color"
          values="#00C6FF;#E1306C;#00C6FF"
          dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="220" height="45" rx="8" fill="url(#em1)"/>
  <text x="50%" y="50%" font-family="Arial, Helvetica, sans-serif" font-weight="bold"
        font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="central"
        letter-spacing="1">Email</text>
</svg>
